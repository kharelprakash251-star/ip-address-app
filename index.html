<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPv4/IPv6 Address App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>IPv4 / IPv6 Address Application</h1>
    <p class="subtitle">Validate IP addresses and calculate IPv4 subnet details</p>

    <div class="card">
      <label for="ipInput">IP Address</label>
      <input type="text" id="ipInput" placeholder="Example: 192.168.1.10 or 2001:db8::1">

      <label for="prefixInput">Subnet Prefix (IPv4 only)</label>
      <input type="number" id="prefixInput" placeholder="Example: 24" min="0" max="32">

      <button id="checkBtn">Validate / Calculate</button>
    </div>

    <div class="card">
      <h2>Results</h2>
      <div id="results">
        Enter an IP address and click the button.
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
